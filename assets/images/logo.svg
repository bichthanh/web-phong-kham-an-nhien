<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Icon: Medical Cross + Lotus / Life Heart -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Shield / Circular background -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#anGrad)" />
    
    <!-- White Medical Cross inside with soft rounded ends -->
    <path d="M40 18 C43 18 45 20 45 23 L45 35 L57 35 C60 35 62 37 62 40 C62 43 60 45 57 45 L45 45 L45 57 C45 60 43 62 40 62 C37 62 35 60 35 57 L35 45 L23 45 C20 45 18 43 18 40 C18 37 20 35 23 35 L35 35 L35 23 C35 20 37 18 40 18 Z" fill="#FFFFFF" />
    
    <!-- Heart / Leaf overlay center -->
    <circle cx="40" cy="40" r="7" fill="#0D9488" />
    <path d="M37 39 C37 37 40 35 40 37 C40 35 43 37 43 39 C43 41 40 43 40 43 C40 43 37 41 37 39 Z" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(110, 20)">
    <!-- Small Category Label -->
    <text x="0" y="16" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0284C7" letter-spacing="2.5">
      PHÒNG KHÁM ĐA KHOA
    </text>
    
    <!-- Main Brand Name -->
    <text x="0" y="47" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#0F172A" letter-spacing="1">
      AN NHIÊN
      <tspan font-size="16" font-weight="700" fill="#0D9488" dx="8">NAM ĐỊNH</tspan>
    </text>
    
    <!-- Slogan / Subtitle -->
    <text x="0" y="68" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B" letter-spacing="0.5">
      Chăm sóc bằng tâm • Nâng tầm sức khỏe • BHYT thông tuyến
    </text>
  </g>
</svg>
